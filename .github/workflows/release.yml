name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["tools/models/**", ".github/workflows/models.yml", "docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v0.1.0

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: gradle, cache-dependency-path: ".github/workflows/release.yml" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - name: Build (core, CLI, APK)
        shell: bash
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          {
            cargo test --release
            cargo build --release
            cargo install cargo-ndk --locked
            PLATFORMS=android bash scripts/setup_flutter.sh
            bash scripts/build_android.sh
            cd app/flutter
            flutter analyze --no-fatal-infos --no-fatal-warnings || true
            # Maven Central sometimes answers 429: retry with back-off
            for i in 1 2 3 4; do flutter build apk --release && break; [ $i = 4 ] && exit 1; sleep $((i*60)); done
          } 2>&1 | tee build-android.log
          mkdir -p dist
          cp app/flutter/build/app/outputs/flutter-apk/app-release.apk "dist/reis-${VERSION}-android.apk"
          cp target/release/reis "dist/reis-cli-${VERSION}-linux-x86_64"
          cp target/release/libreis_core.so "dist/libreis_core-${VERSION}-linux-x86_64.so"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: dist/* }
      - name: Publish logs on failure
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "ci-logs" --notes "Build logs of failed CI runs"
          gh release upload ci-logs build-android.log --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (core, CLI, Windows app)
        shell: bash
        run: |
          set -o pipefail
          {
            cargo build --release
            PLATFORMS=windows bash scripts/setup_flutter.sh
            cd app/flutter
            flutter build windows --release
          } 2>&1 | tee build-windows.log
          R=app/flutter/build/windows/x64/runner/Release
          cp target/release/reis_core.dll "$R/"
          mkdir -p dist
          powershell -Command "Compress-Archive -Path '$R\\*' -DestinationPath 'dist\\reis-${VERSION}-windows-x64.zip'"
          cp target/release/reis.exe "dist/reis-cli-${VERSION}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: dist/* }
      - name: Publish logs on failure
        if: failure()
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "ci-logs" --notes "Build logs of failed CI runs"
          gh release upload ci-logs build-windows.log --clobber

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create / update release
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "Reis $VERSION" --notes-file .github/release-notes.md
          fi
