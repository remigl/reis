name: reis
description: Reconnaissance musicale 100 % hors ligne avec paroles synchronisées.
publish_to: none
version: 0.4.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  record: ^7.2.0            # microphone PCM stream (Android/iOS/desktop)
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  file_picker: ^10.3.3      # one-time catalog import (10.3.3+: compileSdk follows Flutter)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # neural model used to build "types de sons" libraries on the device;
    # downloaded from the models-v1 release by CI / scripts/setup_flutter.sh
    - assets/models/
  # Optional: ship a small catalog inside the APK (copied on first launch):
  #   - assets/catalog.reis
